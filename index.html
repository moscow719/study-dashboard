<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#5b3fd1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Study" />
  <title>Study Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
        <div class="hero-text">
          <h1>Study Dashboard</h1>
          <p class="hello">أهلاً، Fathi 👋</p>
          <p class="sub">يلا نذاكر النهاردة!</p>
        </div>
        <button class="icon-btn bell" id="bellBtn" aria-label="التنبيهات">
          🔔
          <span class="notif-badge hidden" id="notifBadge">0</span>
        </button>
        <div class="avatar">F</div>
      </div>

      <div class="notif-panel hidden" id="notifPanel"></div>

      <div class="search">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="search" placeholder="ابحث عن محاضرة أو شيت أو امتحان..." />
      </div>
    </header>

    <main id="homeView">
      <div class="term-switch" id="termSwitch"></div>

      <section class="overall">
        <div class="overall-head">
          <span>Overall Progress</span>
          <strong id="overallText">0%</strong>
        </div>
        <div class="bar"><span id="overallBar"></span></div>
      </section>

      <section class="subjects-section">
        <div class="section-head">
          <h2>موادي</h2>
          <span class="link" id="termLabel"></span>
        </div>
        <div class="grid" id="subjectGrid"></div>
      </section>

      <section class="upcoming-section">
        <div class="section-head">
          <h2>المواعيد القادمة</h2>
          <span class="link">عرض الكل</span>
        </div>
        <div class="card" id="upcomingList"></div>
      </section>
    </main>

    <main id="statsView" class="stats-view hidden"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="home"><span>🏠</span>الرئيسية</button>
      <button class="nav-btn" data-nav="upcoming"><span>🗓️</span>المواعيد</button>
      <button class="nav-btn" data-nav="stats"><span>📊</span>الإحصائيات</button>
      <button class="nav-btn" data-nav="more"><span>⋯</span>المزيد</button>
    </nav>
  </div>

  <div class="modal hidden" id="subjectModal"></div>

  <div class="backdrop hidden" id="backdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="avatar small">F</div>
      <div class="drawer-user">
        <strong>Fathi</strong>
        <small>Study Dashboard</small>
      </div>
      <button class="close-btn" data-drawer-close aria-label="إغلاق">✕</button>
    </div>
    <div class="drawer-nav">
      <button class="drawer-item" data-nav="home"><span>🏠</span>الرئيسية</button>
      <button class="drawer-item" data-nav="upcoming"><span>🗓️</span>المواعيد</button>
      <button class="drawer-item" data-nav="stats"><span>📊</span>الإحصائيات</button>
      <div class="drawer-sep"></div>
      <button class="drawer-item" data-action="backup"><span>⬇️</span>نسخ احتياطي للبيانات</button>
      <button class="drawer-item" data-action="restore"><span>⬆️</span>استرجاع من نسخة احتياطية</button>
      <div class="drawer-sep"></div>
      <button class="drawer-item danger" data-action="reset"><span>🗑️</span>مسح كل البيانات</button>
    </div>
  </aside>

  <input type="file" id="restoreInput" accept=".json,application/json" class="hidden" />

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
